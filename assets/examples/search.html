<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目搜索 · Material Design 3</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../motion.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: var(--md-sys-typescale-body-large-font);
      font-size: var(--md-sys-typescale-body-large-size);
      line-height: var(--md-sys-typescale-body-large-line-height);
      letter-spacing: var(--md-sys-typescale-body-large-tracking);
    }
    main {
      width: min(100%, 47rem);
      margin: 8vh auto;
      padding: 0 var(--md-sys-measurement-space300);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--md-sys-measurement-space200);
      margin-block-end: var(--md-sys-measurement-space300);
    }
    h1 {
      margin: 0;
      font-family: var(--md-sys-typescale-headline-large-font);
      font-size: var(--md-sys-typescale-headline-large-size);
      line-height: var(--md-sys-typescale-headline-large-line-height);
      font-weight: var(--md-sys-typescale-emphasized-headline-large-weight);
    }
    .theme-toggle {
      min-height: 2.5rem;
      padding-inline: var(--md-sys-measurement-space200);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      font-family: var(--md-sys-typescale-label-large-font);
      font-size: var(--md-sys-typescale-label-large-size);
      font-weight: var(--md-sys-typescale-label-large-weight);
      cursor: pointer;
      transition: background-color var(--m3-fast-effects-duration) var(--m3-fast-effects-curve);
    }
    .theme-toggle:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--md-sys-state-hover-state-layer-opacity) * 100%), var(--md-sys-color-surface-container-low));
    }
    .theme-toggle:focus-visible,
    input:focus-visible {
      outline: var(--md-sys-state-focus-indicator-thickness) solid var(--md-sys-color-secondary);
      outline-offset: var(--md-sys-state-focus-indicator-outer-offset);
    }
    label {
      display: block;
      margin-block-end: var(--md-sys-measurement-space100);
      color: var(--md-sys-color-on-surface-variant);
      font-size: var(--md-sys-typescale-label-large-size);
      font-weight: var(--md-sys-typescale-label-large-weight);
    }
    .anchor { position: relative; }
    input {
      inline-size: 100%;
      min-block-size: var(--md-sys-measurement-space700);
      border: 0;
      border-radius: var(--md-sys-shape-corner-full);
      padding-inline: var(--md-sys-measurement-space300);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font: inherit;
      transition: background-color var(--m3-fast-effects-duration) var(--m3-fast-effects-curve);
    }
    input:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--md-sys-state-hover-state-layer-opacity) * 100%), var(--md-sys-color-surface-container-high));
    }
    input::placeholder { color: var(--md-sys-color-on-surface-variant); }
    #suggestions {
      position: absolute;
      inset-inline: 0;
      z-index: 1;
      margin: var(--md-sys-measurement-space100) 0 0;
      padding: var(--md-sys-measurement-space50);
      list-style: none;
      border-radius: var(--md-sys-shape-corner-large);
      background: var(--md-sys-color-surface-container-high);
      box-shadow: var(--md-sys-elevation-level3);
    }
    [role=option] {
      display: flex;
      align-items: center;
      min-height: var(--md-sys-measurement-space600);
      padding-inline: var(--md-sys-measurement-space250);
      border-radius: var(--md-sys-shape-corner-medium);
      cursor: pointer;
    }
    [role=option]:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) calc(var(--md-sys-state-hover-state-layer-opacity) * 100%), transparent);
    }
    [role=option][aria-selected=true] {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    #suggestions:not([hidden]) {
      animation: appear var(--m3-fast-effects-duration) var(--m3-fast-effects-curve);
    }
    @keyframes appear { from { opacity: 0; } }
    #status {
      color: var(--md-sys-color-on-surface-variant);
      margin-block: var(--md-sys-measurement-space300) var(--md-sys-measurement-space50);
      font-size: var(--md-sys-typescale-body-medium-size);
    }
    #results {
      list-style: none;
      padding: 0;
      margin: var(--md-sys-measurement-space100) 0 0;
      display: grid;
      gap: var(--md-sys-measurement-space100);
    }
    #results li {
      padding: var(--md-sys-measurement-space150) var(--md-sys-measurement-space200);
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container-low);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>项目库</h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">切换深浅色</button>
    </header>
    <form role="search">
      <label for="project">搜索项目</label>
      <div class="anchor">
        <input id="project" type="search" role="combobox" autocomplete="off" placeholder="按项目名称搜索"
               aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
        <ul id="suggestions" role="listbox" aria-label="项目建议" hidden></ul>
      </div>
    </form>
    <p id="status" role="status"></p>
    <ul id="results" aria-label="搜索结果"></ul>
  </main>
  <script>
    const projects = ["档案数字化", "门店巡检", "季度结算", "客户档案"];
    const form = document.querySelector("form");
    const input = document.querySelector("#project");
    const list = document.querySelector("#suggestions");
    const results = document.querySelector("#results");
    const status = document.querySelector("#status");
    const themeToggle = document.querySelector("#theme-toggle");
    let active = -1;

    function currentTheme() {
      const explicit = document.documentElement.dataset.theme;
      if (explicit === "dark" || explicit === "light") return explicit;
      return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function syncThemeToggle() {
      themeToggle.setAttribute("aria-pressed", String(currentTheme() === "dark"));
    }

    themeToggle.addEventListener("click", () => {
      document.documentElement.dataset.theme = currentTheme() === "dark" ? "light" : "dark";
      syncThemeToggle();
    });
    syncThemeToggle();

    function matching() {
      const query = input.value.trim();
      return projects.filter(name => name.includes(query));
    }

    function setExpanded(expanded) {
      active = -1;
      list.hidden = !expanded;
      input.setAttribute("aria-expanded", String(expanded));
      input.removeAttribute("aria-activedescendant");
    }

    function showSuggestions() {
      const matches = matching();
      list.replaceChildren(...matches.map((name, index) => {
        const option = document.createElement("li");
        option.id = "project-option-" + index;
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", "false");
        option.textContent = name;
        option.addEventListener("pointerdown", event => event.preventDefault());
        option.addEventListener("click", () => choose(name));
        return option;
      }));
      setExpanded(matches.length > 0);
    }

    function submitQuery() {
      setExpanded(false);
      const found = matching();
      results.replaceChildren(...found.map(name => {
        const item = document.createElement("li");
        item.textContent = name;
        return item;
      }));
      status.textContent = found.length ? "找到 " + found.length + " 个项目" : "没有匹配的项目";
    }

    function choose(name) {
      input.value = name;
      submitQuery();
    }

    input.addEventListener("focus", showSuggestions);
    input.addEventListener("click", showSuggestions);
    input.addEventListener("input", showSuggestions);
    input.addEventListener("blur", () => setExpanded(false));
    input.addEventListener("keydown", event => {
      if (event.isComposing) return;
      if (event.key === "Escape" && !list.hidden) {
        event.preventDefault();
        setExpanded(false);
      } else if (event.key === "Enter" && active >= 0) {
        event.preventDefault();
        choose(list.children[active].textContent);
      } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        if (list.hidden) showSuggestions();
        if (list.hidden) return;
        event.preventDefault();
        const last = list.children.length - 1;
        if (event.key === "ArrowDown") {
          active = Math.min(active + 1, last);
        } else {
          active = active === -1 ? last : Math.max(active - 1, 0);
        }
        for (const [index, option] of Array.from(list.children).entries()) {
          option.setAttribute("aria-selected", String(index === active));
        }
        input.setAttribute("aria-activedescendant", list.children[active].id);
      }
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      submitQuery();
    });
    submitQuery();
  </script>
</body>
</html>
